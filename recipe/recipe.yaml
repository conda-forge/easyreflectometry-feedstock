context:
  name: easyreflectometry
  version: "1.7.0"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/easyreflectometry-${{ version }}.tar.gz
  sha256: 8f6556cbcca3f6d32fadb14792257cc40aa79f73514983757b48354808489f5f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - versioningit
    - pip
  run:
    - python >=${{ python_min }}
    - easyscience >=2.5.1
    - scipp
    - refnx
    - refl1d >=1.0.0
    - orsopy
    - if: unix
      then:
        - __unix
        - svglib <1.6
    - xhtml2pdf
    - bumps
    - pooch
    - plotly

tests:
  - python:
      imports:
        - easyreflectometry
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.easyreflectometry.org/
  summary: A reflectometry python package built on the EasyScience framework.
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/easyscience/EasyReflectometryLib

extra:
  recipe-maintainers:
    - MridulS
    - conda-forge/easyscience
